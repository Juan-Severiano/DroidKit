name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 \
            -k $KEYCHAIN_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

      - name: Delete existing tag if exists
        run: |
          git push --delete origin v${{ github.event.inputs.version }} 2>/dev/null || true
          git tag -d v${{ github.event.inputs.version }} 2>/dev/null || true

      - name: Build Release
        run: |
          xcodebuild -project DroidKit.xcodeproj \
            -scheme DroidKit \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGNING_REQUIRED=YES

      - name: Create DMG
        run: |
          APP_PATH=$(find DerivedData -name "DroidKit.app" -type d | head -1)
          hdiutil create -volname "DroidKit" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit DroidKit-${{ github.event.inputs.version }}.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Get Changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CONTENT=$(sed -n '/^## /{n;:a;N;/^## /!ba;p}' CHANGELOG.md | head -c 5000)
            echo "content=$CONTENT" >> $GITHUB_OUTPUT
          else
            echo "content=" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: DroidKit ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: DroidKit-${{ github.event.inputs.version }}.dmg
          draft: true
