name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Delete existing tag if exists
        run: |
          git push --delete origin v${{ github.event.inputs.version }} 2>/dev/null || true
          git tag -d v${{ github.event.inputs.version }} 2>/dev/null || true

      - name: Archive
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DroidKit.xcodeproj \
            -scheme DroidKit \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DroidKit.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION"

      - name: Export app
        run: |
          APP_PATH="$RUNNER_TEMP/DroidKit.xcarchive/Products/Applications/DroidKit.app"
          mkdir -p dist
          cp -R "$APP_PATH" dist/DroidKit.app

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 dist/DroidKit.app

      - name: Create DMG
        run: |
          hdiutil create -volname "DroidKit" \
            -srcfolder dist/DroidKit.app \
            -ov \
            -format UDZO \
            DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Sign DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          codesign --force --sign "$DEVELOPER_ID_APPLICATION" DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit DroidKit-${{ github.event.inputs.version }}.dmg \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Verify notarization
        run: spctl --assess --type open --context context:primary-signature -v DroidKit-${{ github.event.inputs.version }}.dmg

      - name: Get Changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            CONTENT=$(sed -n '/^## /{n;:a;N;/^## /!ba;p}' CHANGELOG.md | head -c 5000)
            echo "content=$CONTENT" >> $GITHUB_OUTPUT
          else
            echo "content=" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: DroidKit ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: DroidKit-${{ github.event.inputs.version }}.dmg
          draft: true
