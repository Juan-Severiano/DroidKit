name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project DroidKit.xcodeproj \
            -scheme DroidKit \
            -configuration Release \
            -sdk macosx \
            build \
            CODE_SIGNING_ALLOWED=NO
